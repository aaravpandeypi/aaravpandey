<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aarav Pandey / AP</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  // Load Firebase in the background so the static shell can paint immediately.
  window.firebaseReady = (async () => {

      import("https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js")
    ]);

  const firebaseConfig = {
    apiKey: "AIzaSyBK9x_XJ4nblZT6FTDYeCZ-RhAVRsoGl74",
    authDomain: "aarav-pandey-website.firebaseapp.com",
    databaseURL: "https://aarav-pandey-website-default-rtdb.firebaseio.com",
    projectId: "aarav-pandey-website",
    storageBucket: "aarav-pandey-website.firebasestorage.app",
    messagingSenderId: "14412214846",
    appId: "1:14412214846:web:4327bb13d6622743e3576f",
    measurementId: "G-CEMXKS7RYQ"
  };

  const fbApp = initializeApp(firebaseConfig);
  const fbDb = getFirestore(fbApp);

  // Expose what the app script (below, a classic script) needs.

  window.fbGetDoc = getDoc;
  window.fbSetDoc = setDoc;
  window.fbDeleteDoc = deleteDoc;
  window.fbDb = fbDb;
  })();
</script>
<style>
  :root{
    --cream:#f2ecdd;
    --cream-2:#ece4d0;
    --ink:#211c14;
    --orange:#e2652b;
    --orange-dark:#c1501e;
    --sage:#b7c495;
    --sage-dark:#8fa06a;
    --line:#211c14;
    --muted:#5c5546;
    --body-font:'Space Grotesk', Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0; padding:0; overflow-x:hidden; width:100%;}
  h1,h2,h3,.pixel{overflow-wrap:break-word; word-break:break-word;}
  body{
    background:var(--cream);
    background-image:radial-gradient(var(--ink) .6px, transparent .6px);
    background-size:16px 16px;
    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--body-font);
    min-height:100vh;
  }
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}
  }
  h1,h2,h3,.pixel{
    font-family:'Press Start 2P', monospace;
    line-height:1.5;
    letter-spacing:0.5px;
  }
  a{color:inherit;}
  button{font-family:var(--body-font); cursor:pointer;}
  .wrap{max-width:1200px; margin:0 auto; padding:0 32px;}
  /* NAV */
  header{position:sticky; top:0; z-index:50; background:var(--cream); border-bottom:3px solid var(--ink);}
  .navbar{display:flex; align-items:center; justify-content:space-between; padding:20px 32px; max-width:1200px; margin:0 auto;}
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .brand .dot{width:12px; height:12px; background:var(--orange); transform:rotate(45deg);}
  .brand span{font-family:'Press Start 2P', monospace; font-size:14px;}
  nav.links{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
  nav.links a{font-size:14px; font-weight:bold; text-decoration:none; padding:4px 2px; border-bottom:2px solid transparent; cursor:pointer; transition:border-color .2s ease, opacity .2s ease;}
  nav.links a:hover{opacity:.65;}
  nav.links a:hover, nav.links a.active{border-bottom:2px solid var(--orange);}
  nav.links.open{animation:dropIn .22s ease;}
  .mobile-toggle{display:none; font-size:22px; background:none; border:none; transition:transform .2s ease;}
  .mobile-toggle:active{transform:scale(.9);}

  #app{min-height:70vh; padding-top:120px; padding-bottom:90px;}
  @media(max-width:900px){ #app{padding-top:96px; padding-bottom:70px;} }
  #app{transition:opacity .32s ease, transform .32s ease; opacity:1; transform:translateY(0);}
  #app.page-out{opacity:0; transform:translateY(10px);}
  .site-loader{position:fixed;inset:0;z-index:1000;background:var(--cream);display:flex;align-items:center;justify-content:center;transition:opacity .28s ease,visibility .28s ease;}
  .site-loader.done{opacity:0;visibility:hidden;pointer-events:none;}
  .loader-box{border:3px solid var(--ink);background:var(--sage);box-shadow:7px 7px 0 var(--ink);padding:24px 28px;min-width:250px;text-align:center;}
  .loader-label{font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.8;}
  .loader-status{font-size:12px;margin-top:12px;opacity:.75;}
  .loader-bar{height:8px;border:2px solid var(--ink);margin-top:18px;background:var(--cream);overflow:hidden;}
  .loader-bar span{display:block;height:100%;width:35%;background:var(--orange);animation:loaderPulse 1s ease-in-out infinite;}
  @keyframes loaderPulse{0%{transform:translateX(-110%)}100%{transform:translateX(320%)}}
  @keyframes dropIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* HERO */
  .hero{display:grid; grid-template-columns:1.35fr 1fr; gap:56px; align-items:stretch;}
  .eyebrow{font-size:12px; letter-spacing:1px; color:var(--muted); margin-bottom:18px; font-family:var(--body-font);}
  .eyebrow .blink{display:inline-block; width:7px; height:7px; background:var(--orange); border-radius:50%; margin-right:6px;}
  h1.display{font-size:58px; margin:0 0 28px; line-height:1.35;}
  h1.display .accent{color:var(--orange);}
  .lede{font-size:18px; line-height:1.7; color:#3a3426; max-width:60ch; margin-bottom:34px;}
  .cta-row{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
  .btn-solid{background:var(--orange); color:var(--cream); border:2px solid var(--ink); padding:14px 20px; font-weight:bold; text-decoration:none; box-shadow:4px 4px 0 var(--ink); display:inline-flex; gap:8px; align-items:center; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; cursor:pointer;}
  .btn-solid:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .btn-solid:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink);}
  .btn-line{text-decoration:none; font-weight:bold; border-bottom:2px solid var(--orange); padding-bottom:2px; transition:opacity .15s ease; cursor:pointer;}
  .btn-line:hover{opacity:.65;}

  .console{background:var(--sage); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:26px 26px 30px; display:flex; flex-direction:column; justify-content:space-between; position:relative; animation:fadeUp .5s ease .05s both;}
  .hero > div:first-child{animation:fadeUp .5s ease both;}
  .console-top{display:flex; justify-content:space-between; font-size:11px; font-family:'Press Start 2P', monospace;}
  .console-top .live{display:flex; align-items:center; gap:6px;}
  .console-top .live::before{content:''; width:7px; height:7px; background:var(--ink); border-radius:50%; display:inline-block;}
  .console-art{flex:1; display:flex; align-items:center; justify-content:center; padding:34px 0;}
  .console-art svg{width:96px; height:96px;}
  .console-tags{font-family:'Press Start 2P', monospace; font-size:14px; line-height:2.2;}
  .console-foot{font-size:11px; font-family:'Press Start 2P', monospace; margin-top:22px; line-height:1.8; opacity:.8; cursor:pointer; transition:opacity .15s ease, transform .15s ease; display:inline-block;}
  .console-foot:hover{opacity:1; transform:translateY(2px);}

  .explore-grid{display:grid; grid-template-columns:repeat(3, 1fr); gap:22px; margin-top:64px; scroll-margin-top:120px;}
  .explore-tile{border:2px solid var(--ink); padding:24px; min-height:220px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer; box-shadow:6px 6px 0 var(--ink); transition:transform .15s ease, box-shadow .15s ease; animation:fadeUp .45s ease both;}
  .explore-tile:hover{transform:translate(3px,3px); box-shadow:3px 3px 0 var(--ink);}
  .explore-tile .num{font-family:'Press Start 2P', monospace; font-size:11px;}
  .explore-tile h3{font-size:22px; margin:26px 0 0; line-height:1.4;}
  .explore-tile .arrow{font-size:22px; align-self:flex-end;}
  .tile-orange{background:var(--orange); color:var(--cream);}
  .tile-ink{background:var(--ink); color:var(--cream);}
  .tile-sage{background:var(--cream-2); color:var(--ink);}
  @media(max-width:900px){.explore-grid{grid-template-columns:1fr; margin-top:48px;}}

  .section-title{font-size:26px; margin:0 0 10px;}
  .section-sub{color:var(--muted); font-size:15px; margin-bottom:36px; max-width:64ch;}
  .page-head{margin-bottom:44px; animation:fadeUp .45s ease both;}

  .btn-sm{background:var(--ink); color:var(--cream); border:none; padding:8px 14px; font-size:13px; font-weight:bold; transition:opacity .15s ease, transform .15s ease;}
  .btn-sm.orange{background:var(--orange);}
  .btn-sm.outline{background:transparent; color:var(--ink); border:2px solid var(--ink);}
  .btn-sm:hover{opacity:.8;}
  .btn-sm:active{transform:scale(.94);}
  .admin-bar{background:var(--ink); color:var(--cream); font-size:12px; padding:8px 14px; display:flex; gap:10px; align-items:center; margin-bottom:28px; font-family:'Press Start 2P', monospace;}
  .admin-bar .adot{width:8px;height:8px;background:var(--orange);border-radius:50%;}

  /* BOXED INDEX + PANEL LAYOUT (used by Flaperon + MUN) */
  .index-grid{display:grid; grid-template-columns:1.55fr 1fr; gap:24px; align-items:start;}
  .index-box{border:2px solid var(--ink); background:var(--cream-2); box-shadow:6px 6px 0 var(--ink); padding:26px; animation:fadeUp .45s ease .05s both;}
  .index-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:20px;}
  .index-head .label{font-family:'Press Start 2P', monospace; font-size:11px;}
  .index-head .tag{font-family:'Press Start 2P', monospace; font-size:10px; color:var(--muted);}

  .panel-box{border:2px solid var(--ink); background:var(--sage); box-shadow:6px 6px 0 var(--ink); padding:26px; position:sticky; top:100px; animation:fadeUp .45s ease .1s both;}
  .panel-box input, .panel-box textarea{transition:border-color .15s ease, box-shadow .15s ease;}
  .panel-box input:focus, .panel-box textarea:focus{outline:none; border-color:var(--orange); box-shadow:0 0 0 3px rgba(226,101,43,.18);}
  .panel-box .label{font-family:'Press Start 2P', monospace; font-size:10px; margin-bottom:16px; display:block;}
  .panel-box h3{font-size:20px; margin:0 0 10px; font-family:var(--body-font); font-weight:bold;}
  .panel-box p.desc{font-size:13.5px; color:#2c2818; margin:0 0 18px; line-height:1.6;}
  .panel-box input, .panel-box textarea{width:100%; padding:11px; border:2px solid var(--ink); margin-bottom:12px; font-family:var(--body-font); font-size:13.5px; background:var(--cream);}
  .panel-box textarea{min-height:80px; resize:vertical;}
  .panel-box .dashed-zone{border:2px dashed var(--ink); padding:13px; font-size:12.5px; color:#2c2818; margin-bottom:14px; background:rgba(255,255,255,.28);}
  .panel-box .submit-wide{width:100%; text-align:center; justify-content:center;}
  .result-strip{background:var(--cream); border:2px solid var(--ink); padding:12px 14px; font-size:12.5px; margin-top:14px; word-break:break-all;}
  .result-strip b{font-family:'Press Start 2P', monospace; font-size:11px; display:block; margin-bottom:6px;}
  @media(max-width:900px){.index-grid{grid-template-columns:1fr;} .panel-box{position:static;}}

  /* FLAPERON list rows inside index box */
  .research-list{display:flex; flex-direction:column; gap:16px;}
  .research-row{background:var(--cream); border:2px solid var(--ink); padding:18px 20px; display:flex; justify-content:space-between; gap:16px; align-items:flex-start; flex-wrap:wrap; transition:transform .15s ease, box-shadow .15s ease;}
  .research-row:hover{transform:translate(-2px,-2px); box-shadow:3px 3px 0 var(--ink);}
  .research-row h3{font-size:15px; margin:0 0 8px; font-family:var(--body-font); font-weight:bold;}
  .research-row .meta{font-size:12px; color:var(--muted); margin-bottom:8px;}
  .research-row p{font-size:14px; color:#3a3426; margin:0; max-width:60ch; line-height:1.6;}
  .research-actions{display:flex; gap:8px; flex-shrink:0;}

  /* PHOTOGRAPHY masonry */
  .masonry{column-count:3; column-gap:18px;}
  .masonry .ph{break-inside:avoid; margin-bottom:18px; border:2px solid var(--ink); background:var(--cream-2); position:relative; overflow:hidden; animation:fadeUp .4s ease both;}
  .masonry .ph img{display:block; width:100%; height:auto; transition:transform .35s ease;}
  .masonry .ph:hover img{transform:scale(1.045);}
  .masonry .ph .cap{padding:10px 12px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; align-items:center; gap:8px;}
  @media(max-width:900px){.masonry{column-count:2;}}
  @media(max-width:560px){.masonry{column-count:1;}}

  /* REORDER / REFERENCES */
  .reorder-actions{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .reorder-actions .btn-sm{min-width:34px; padding:7px 9px; text-align:center;}
  .reference-block{position:relative; overflow:hidden;}
  .reference-mark{position:absolute; top:-18px; right:18px; font-family:'Press Start 2P',monospace; font-size:52px; line-height:1; color:var(--orange); opacity:.16; pointer-events:none;}
  .reference-meta{font-size:12px; color:var(--muted); margin:-4px 0 14px;}
  .reference-empty{border:2px dashed var(--ink); padding:34px 24px; background:var(--cream-2); text-align:center;}

  /* PROJECTS / EXPERIENCE sections */
  .block{border:2px solid var(--ink); background:var(--cream-2); padding:28px; margin-bottom:26px; box-shadow:5px 5px 0 var(--ink); animation:fadeUp .4s ease both; transition:transform .15s ease, box-shadow .15s ease;}
  .block h3{font-size:17px; margin:0 0 14px; font-family:var(--body-font); font-weight:bold; border-bottom:2px solid var(--orange); display:inline-block; padding-bottom:6px;}
  .block img{max-width:100%; height:auto; border:2px solid var(--ink); margin:14px 0;}
  .block p{font-size:14.5px; line-height:1.7; color:#3a3426; margin:0 0 10px;}
  .block a.link{color:var(--orange-dark); font-weight:bold; text-decoration:underline;}
  .sub{border-left:3px solid var(--sage-dark); padding-left:16px; margin-top:18px;}
  .sub h4{font-size:13px; margin:0 0 6px;}
  .block-actions{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}
  .add-box{border:2px dashed var(--ink); background:transparent; padding:22px; text-align:center; margin-bottom:26px; cursor:pointer; color:var(--muted); font-size:13.5px; font-weight:bold; transition:background .18s ease, color .18s ease, transform .15s ease;}
  .add-box:hover{background:var(--cream-2); color:var(--ink); transform:translateY(-2px);}
  .add-box:active{transform:translateY(0);}


  .marks-tools{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 12px;font-family:'Press Start 2P',monospace;font-size:9px;text-transform:uppercase;color:#8a8168;}
  table.marks .total-cell{font-family:'Press Start 2P',monospace;font-size:11px;background:var(--cream-2);font-weight:700;text-align:center;}
  @media(max-width:700px){#countryMatrix{grid-template-columns:1fr 1fr !important;}}
  @media(max-width:480px){#countryMatrix{grid-template-columns:1fr !important;}}
  /* MUN conference tiles */
  .conf-grid{display:flex; flex-direction:column; gap:14px;}
  .conf-tile{border:2px solid var(--ink); background:var(--cream); padding:18px 20px; box-shadow:4px 4px 0 var(--ink); cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:14px; transition:transform .15s ease, box-shadow .15s ease;}
  .conf-tile:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .conf-tile .status{transition:background .15s ease;}
  .conf-tile h3{font-size:14px; margin:0 0 6px; font-family:var(--body-font); font-weight:bold;}
  .conf-tile .code{font-size:10px; color:var(--muted); font-family:'Press Start 2P',monospace;}
  .conf-tile .status{font-size:11px; font-weight:bold; padding:5px 10px; border:2px solid var(--ink); white-space:nowrap;}
  .conf-tile .status.live{background:var(--orange); color:var(--cream); border-color:var(--ink);}
  .conf-tile .status.pending{background:transparent; color:var(--muted);}

  table.marks{width:100%; border-collapse:collapse; background:var(--cream); border:2px solid var(--ink);}
  table.marks th, table.marks td{border:1px solid var(--ink); padding:10px 12px; font-size:13px; text-align:left;}
  table.marks th{background:var(--ink); color:var(--cream); font-size:11px; letter-spacing:.5px;}
  table.marks input, table.marks select{width:100%; border:1px solid #999; padding:5px; font-size:13px; font-family:var(--body-font);}
  .rc-present{color:#3a7d3a; font-weight:bold;}
  .rc-pv{color:var(--orange-dark); font-weight:bold;}
  .rc-absent{color:#a33; font-weight:bold;}
  .roll-select-wrap{position:relative;width:100%;min-width:78px;}
  .roll-select-wrap select{width:100%;cursor:pointer;}
  .roll-select-wrap select option{color:var(--ink);background:var(--cream);}
  table.marks tr.mun-winner td{background:#dfe8c9;}
  table.marks tr.mun-manual-highlight td{background:var(--mun-highlight,#f4df9a);}
  table.marks .highlight-cell{min-width:112px;}
  table.marks .highlight-tools{display:flex;align-items:center;gap:6px;}
  table.marks .highlight-tools select{width:auto;min-width:76px;padding:4px;font-size:11px;}
  table.marks .highlight-tools input[type=color]{width:34px;height:30px;padding:2px;cursor:pointer;}
  .winner-note{font-size:10px;color:#6f7657;font-family:'Press Start 2P',monospace;margin-top:8px;}

  .chatbox{border:2px solid var(--ink); background:var(--cream); max-height:280px; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; margin-bottom:16px;}
  .chatbox .msg{background:var(--cream-2); border-left:3px solid var(--orange); padding:8px 12px; font-size:13.5px;}
  .chatbox .msg .ts{font-size:10px; color:var(--muted); margin-bottom:4px;}
  .chat-input-row{display:flex; gap:10px;}
  .chat-input-row input{flex:1; padding:10px; border:2px solid var(--ink); font-size:14px;}

  .empty{color:var(--muted); font-size:14px; padding:24px 0; font-style:italic;}
  footer{background:var(--ink); color:var(--cream); padding:64px 0 30px; margin-top:70px;}
  footer .footer-grid{display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:end; gap:48px; padding-bottom:34px;}
  footer .footer-eyebrow{font-size:11px; letter-spacing:1px; color:#cbbfa4; margin-bottom:18px; font-family:var(--body-font);}
  footer h2.footer-heading{font-size:34px; color:var(--cream); margin:0; line-height:1.4;}
  footer h2.footer-heading .accent{color:var(--orange);}
  footer .footer-meta{text-align:right; font-size:12px; color:#cbbfa4; line-height:2; white-space:nowrap;}
  footer .footer-bottom{border-top:1px solid #3a3426; padding:20px 32px 0; display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; column-gap:24px; font-size:12px; color:#8a8168;}
  footer .footer-nav-links{display:flex; gap:18px; flex-wrap:wrap; align-items:center; min-width:0;}
  footer .footer-nav-links a{cursor:pointer; color:#cbbfa4; text-decoration:none; transition:color .15s ease;}
  footer .footer-nav-links a:hover{color:var(--orange);}
  footer .admin-link{cursor:pointer; text-decoration:underline; color:#cbbfa4; justify-self:end; white-space:nowrap;}
  footer .admin-link:hover{color:var(--orange);}
  @media(max-width:700px){ footer .footer-grid{grid-template-columns:1fr; align-items:flex-start;} footer .footer-meta{text-align:left; white-space:normal;} footer h2.footer-heading{font-size:26px;} footer .footer-bottom{grid-template-columns:1fr; justify-items:center; text-align:center;} footer .footer-nav-links{justify-content:center; width:100%;} footer .admin-link{justify-self:center;} }
  .back-link{display:inline-block; margin-bottom:24px; font-size:13px; font-weight:bold; text-decoration:none; border-bottom:2px solid var(--orange);}

  /* MODALS (replace prompt/confirm/alert, which the sandboxed preview blocks) */
  .modal-overlay{position:fixed; inset:0; background:rgba(33,28,20,0); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; transition:background .22s ease;}
  .modal-overlay.show{background:rgba(33,28,20,.6);}
  .modal-box{background:var(--cream); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); max-width:460px; width:100%; padding:28px; max-height:85vh; overflow-y:auto; opacity:0; transform:translateY(16px) scale(.98); transition:opacity .22s ease, transform .22s ease;}
  .modal-overlay.show .modal-box{opacity:1; transform:translateY(0) scale(1);}
  .modal-box h3{font-size:15px; margin:0 0 6px; font-family:var(--body-font); font-weight:bold;}
  .modal-box .mdesc{font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.5;}
  .modal-field{margin-bottom:15px;}
  .modal-field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:bold;}
  .modal-field input, .modal-field textarea, .modal-field select{width:100%; padding:10px; border:2px solid var(--ink); font-size:14px; font-family:var(--body-font); background:var(--cream-2);}
  .modal-field textarea{min-height:90px; resize:vertical;}
  .modal-field.dashed input{border-style:dashed;}

<script type="module">
/* ---------------- STATE & STORAGE HELPERS (Firestore-backed) ---------------- */
const state = { page:'home', munCode:null, isAdmin:false };

const dataCache = new Map();
const pendingReads = new Map();
const CACHE_PREFIX = 'ap_portfolio:';

function readLocalCache(key){
  try{
    const raw = localStorage.getItem(CACHE_PREFIX + key);
    return raw ? JSON.parse(raw) : null;
  } catch(e){ return null; }
}
function writeLocalCache(key, value){
  try{ localStorage.setItem(CACHE_PREFIX + key, JSON.stringify(value)); } catch(e){}
}
async function sget(key){
  if(dataCache.has(key)) return dataCache.get(key);
  const cached = readLocalCache(key);
  if(cached !== null){
    dataCache.set(key, cached);
    refreshSget(key);
    return cached;
  }
  return refreshSget(key);
}
async function refreshSget(key){
  if(pendingReads.has(key)) return pendingReads.get(key);
  const request = (async ()=>{
    try{
      await window.firebaseReady;
      const snap = await window.fbGetDoc(window.fbDoc(window.fbDb, 'portfolio', key));
      if(!snap.exists()){ dataCache.set(key, null); return null; }
      const data = snap.data();
      const value = data.value !== undefined ? JSON.parse(data.value) : null;
      dataCache.set(key, value);
      writeLocalCache(key, value);
      return value;
    } catch(e){ console.error('sget failed for', key, e); return dataCache.get(key) ?? null; }
    finally{ pendingReads.delete(key); }
  })();
  pendingReads.set(key, request);
  return request;
}
async function sset(key, value){
  try{
    await window.firebaseReady;
    await window.fbSetDoc(window.fbDoc(window.fbDb, 'portfolio', key), { value: JSON.stringify(value) });
    dataCache.set(key, value);
    writeLocalCache(key, value);
    return true;
  } catch(e){ console.error('sset failed for', key, e); return false; }
}

function go(page, extra){
  state.page = page;
  if(extra) Object.assign(state, extra);
  document.getElementById('navLinks').classList.remove('open');
  document.querySelectorAll('nav.links a').forEach(a=>a.classList.toggle('active', a.dataset.p===page));
  if(state.page==='custom') document.querySelectorAll('nav.links a[data-custom-id]').forEach(a=>a.classList.toggle('active', a.dataset.customId===state.customPageId));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------------- MODAL SYSTEM (replaces prompt/confirm/alert) ---------------- */
function resizeImageToBlob(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('toBlob failed')), 'image/jpeg', quality);
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}
function resizeImageToDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openFormModal(opts){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    const fieldsHtml = opts.fields.map(f=>{
      if(f.type==='textarea'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><textarea id="mf-${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea></div>`;
      } else if(f.type==='select'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><select id="mf-${f.name}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
      } else if(f.type==='password'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><input type="password" id="mf-${f.name}" value="${esc(f.value||'')}"></div>`;
      } else if(f.type==='file'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><input type="file" accept="image/*" id="mf-${f.name}" onchange="document.getElementById('fp-${f.name}').textContent = this.files[0] ? this.files[0].name : ''"><div class="file-picked" id="fp-${f.name}"></div></div>`;
      } else {
        return `<div class="modal-field ${f.dashed?'dashed':''}"><label>${esc(f.label)}</label><input type="text" id="mf-${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
      }
    }).join('');
    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>${esc(opts.title)}</h3>
        ${opts.desc?`<p class="mdesc">${esc(opts.desc)}</p>`:''}
        ${fieldsHtml}
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancelBtn" type="button">Cancel</button>
          <button class="modal-submit" id="modalSubmitBtn" type="button">${esc(opts.submitLabel||'Save')}</button>
        </div>
      </div>
    </div>`;
    const overlay = document.getElementById('modalOverlay');
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = (val)=>{
      overlay.classList.remove('show');
      setTimeout(()=>{ root.innerHTML=''; resolve(val); }, 200);
    };
    document.getElementById('modalCancelBtn').onclick = ()=>close(null);
    overlay.onclick = (e)=>{ if(e.target.id==='modalOverlay') close(null); };
    document.getElementById('modalSubmitBtn').onclick = async ()=>{
      const btn = document.getElementById('modalSubmitBtn');
      const originalLabel = btn.textContent;
      const values = {};
      let hasFileField = opts.fields.some(f=>f.type==='file');
      if(hasFileField){ btn.textContent = 'Processing...'; btn.disabled = true; }
      for(const f of opts.fields){
        const el = document.getElementById('mf-'+f.name);
        if(f.type==='file'){
          const file = el.files && el.files[0];
          if(file){
            try{
              values[f.name] = f.output==='blob'
                ? await resizeImageToBlob(file, f.maxDim||1600, f.quality||0.82)
                : await resizeImageToDataURL(file, f.maxDim||1600, f.quality||0.82);
            }
            catch(e){ values[f.name] = null; }
          } else { values[f.name] = null; }
        } else {
          values[f.name] = el.value.trim();
        }
      }
      if(hasFileField){ btn.textContent = originalLabel; btn.disabled = false; }
      close(values);
    };
  });
}
function openConfirmModal(message, danger){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>Are you sure?</h3>
        <p class="mdesc">${esc(message)}</p>
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancelBtn" type="button">Cancel</button>
          <button class="modal-submit ${danger?'danger':''}" id="modalSubmitBtn" type="button">Confirm</button>
        </div>
      </div>
    </div>`;
    const overlay = document.getElementById('modalOverlay');
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = (val)=>{
      overlay.classList.remove('show');
      setTimeout(()=>{ root.innerHTML=''; resolve(val); }, 200);
    };
    document.getElementById('modalCancelBtn').onclick = ()=>close(false);
    overlay.onclick = (e)=>{ if(e.target.id==='modalOverlay') close(false); };
    document.getElementById('modalSubmitBtn').onclick = ()=>close(true);
  });
}
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 3200);
}

/* ---------------- ADMIN TOGGLE ---------------- */
async function toggleAdmin(){
  if(state.isAdmin){
    state.isAdmin = false;
    document.getElementById('adminToggleLabel').textContent = 'Admin';
    render();
    refreshCustomNavigation().catch(()=>{});
    return;
  }
  const saved = await sget('site:admin-passcode');
  if(!saved){
    const v = await openFormModal({
      title:'Set up your admin passcode',
      desc:"You'll use this to edit pages and publish MUN marksheets. Keep it safe — anyone with it can edit the site.",
      fields:[{name:'p', label:'Choose a passcode', type:'password'}],
      submitLabel:'Set passcode'
    });
    if(!v || !v.p) return;
    await sset('site:admin-passcode', v.p);
    state.isAdmin = true;
    showToast('Admin passcode set — you are now in admin mode.');
  } else {
    const v = await openFormModal({ title:'Enter admin passcode', fields:[{name:'p', label:'Passcode', type:'password'}], submitLabel:'Enter' });
    if(!v) return;
    if(v.p === saved){ state.isAdmin = true; showToast('Admin mode on.'); }
    else { showToast('Incorrect passcode.'); return; }
  }
  document.getElementById('adminToggleLabel').textContent = 'Admin: ON';
  render();
  // Refresh dynamic page navigation and populate the admin page index after admin mode appears.
  refreshCustomNavigation().then(()=>{
    renderCustomPageAdminList();
  }).catch(()=>{});
}

/* ---------------- RENDER ROUTER ---------------- */
let renderToken = 0;
async function render(){
  const app = document.getElementById('app');
  const myToken = ++renderToken;
  app.classList.add('page-out');
  let html = '';
  if(state.page==='home') html = pageHome();
  else if(state.page==='flaperon') html = await pageFlaperon();
  else if(state.page==='mun') html = await pageMunList();
  else if(state.page==='mun-detail') html = await pageMunDetail(state.munCode);
  else if(state.page==='photography') html = await pagePhotography();
  else if(state.page==='projects') html = await pageProjects();
  else if(state.page==='experience') html = await pageExperience();
  else if(state.page==='references') html = await pageReferences();
  else if(state.page==='custom') html = await pageCustomPage(state.customPageId);
  if(myToken !== renderToken) return; // a newer render started; drop this one
  app.innerHTML = html;
  void app.offsetWidth;
  app.classList.remove('page-out');
  if(state.isAdmin) requestAnimationFrame(()=>renderCustomPageAdminList());
}

/* ---------------- CUSTOM PAGES ---------------- */
function adminCustomPagesPanel(){
  return `<section class="custom-admin" style="margin-top:64px;"><div class="admin-bar"><span class="adot"></span>ADMIN MODE &mdash; MANAGE PAGES</div><div class="index-grid"><div class="index-box"><div class="index-head"><span class="label">PAGE INDEX</span><span class="tag">SITE / PAGES</span></div><div id="customPageAdminList"><div class="empty">Loading pages...</div></div></div><div class="panel-box"><span class="label">PAGE BUILDER</span><h3>Add a new page</h3><p class="desc">Choose the structure first. You can then build the page without touching the rest of the site.</p><button class="btn-solid submit-wide" onclick="addCustomPage()">+ Add a page</button></div></div></section>`;
}
async function renderCustomPageAdminList(){
  const el=document.getElementById('customPageAdminList'); if(!el)return;
  const list=(await sget('site:pages'))||[];
  if(!list.length){el.innerHTML='<div class="empty">No extra pages yet. Use <b>+ Add a page</b> to create your first one.</div>';return;}
  el.innerHTML=list.map((pg,i)=>{const t={sections:'SECTIONS',gallery:'GALLERY',references:'REFERENCES / LIST',records:'RECORDS'}[pg.type]||'PAGE';return `<div class="research-row" style="align-items:center;"><div><h3>${esc(pg.navTitle||pg.title)}</h3><div class="meta">${t} &middot; /${esc(pg.slug)}</div></div><div class="research-actions"><button class="btn-sm outline" onclick="go('custom',{customPageId:'${pg.id}'})">Open</button><button class="btn-sm outline" onclick="editCustomPage('${pg.id}')">Edit</button><button class="btn-sm outline" onclick="moveCustomPage('${pg.id}',-1)" ${i===0?'disabled':''}>&uarr;</button><button class="btn-sm outline" onclick="moveCustomPage('${pg.id}',1)" ${i===list.length-1?'disabled':''}>&darr;</button><button class="btn-sm outline" onclick="deleteCustomPage('${pg.id}')" title="Delete page">&times;</button></div></div>`;}).join('');
}
function pageTypeDescription(type){return ({sections:'A clean editorial page made of text, optional images and links — like Projects or Experience.',gallery:'A visual page where every entry is an image with an optional caption.',references:'An archive page for LORs, testimonials, awards, certificates, publications, or similar entries.',records:'A structured index for conferences, events, achievements, or other repeatable records.'})[type]||'';}
async function addCustomPage(){
  const pick=await openFormModal({title:'Choose a page type',desc:'Choose the structure that best fits what you want this page to contain.',fields:[{name:'type',label:'Page type',type:'select',options:['sections','gallery','references','records'],value:'sections'}],submitLabel:'Choose type'}); if(!pick)return;
  const v=await openFormModal({title:'Set up your page',desc:pageTypeDescription(pick.type),fields:[{name:'navTitle',label:'Navigation name',placeholder:'e.g. Awards'},{name:'eyebrow',label:'Eyebrow',placeholder:'e.g. AWARDS / RECORDS'},{name:'title',label:'Page title',placeholder:'e.g. Things worth keeping'},{name:'subtitle',label:'Intro / description',type:'textarea'},{name:'slug',label:'URL slug',placeholder:'e.g. awards'}],submitLabel:'Create page'}); if(!v||!v.navTitle||!v.title)return;
  const list=(await sget('site:pages'))||[]; let slug=(v.slug||v.navTitle).toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,''); if(!slug)slug='page-'+uid(); if(list.some(x=>x.slug===slug)){showToast('That URL slug is already in use.');return;}

async function addResearch(){
  const title = document.getElementById('pf-title').value.trim();

  const link = document.getElementById('pf-link').value.trim();
  if(!title || !link){ showToast('Title and a file link are required.'); return; }
  const date = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'});
  const list = (await sget('flaperon:research')) || [];
  list.unshift({id:uid(), title, summary, link, author:'Aarav Pandey', date});
  await sset('flaperon:research', list);
  showToast('Research published.');
  render();
}
async function editResearch(id){
  const list = (await sget('flaperon:research')) || [];

    title:'Edit research',
    fields:[

      {name:'summary', label:'Summary', type:'textarea', value:r.summary},
      {name:'link', label:'Link to file', value:r.link, dashed:true}

  Object.assign(r, v);
  await sset('flaperon:research', list);
  showToast('Research updated.');

  const ok = await openConfirmModal('This research entry will be removed from the public archive.', true);

  let list = (await sget('flaperon:research')) || [];
  list = list.filter(x=>x.id!==id);
  await sset('flaperon:research', list);
  render();
}

async function pagePhotography(){
  const list = (await sget('photography:images')) || [];
  const admin = state.isAdmin;
  let tiles = '';
  if(list.length){
    const withUrls = await Promise.all(list.map(async p => ({ ...p, url: await sget('photo:'+p.id) })));
    tiles = withUrls.filter(p=>p.url).map((p,i)=>`
      <div class="ph" style="animation-delay:${Math.min(i*0.04,0.4)}s;">
        <img src="${p.url}" alt="${esc(p.caption)}" loading="lazy">
        <div class="cap"><span>${esc(p.caption||'')}</span>${admin?`<button class="btn-sm outline" onclick="deletePhoto('${p.id}')">&times;</button>`:''}</div>
      </div>`).join('');
  }
  if(!tiles) tiles = `<div class="empty">No photos uploaded yet.</div>`;
  return `
  <div class="page-head">
    <div class="eyebrow">PHOTOGRAPHY</div>
    <h2 class="section-title">Frames from @theprofiletwo.</h2>
    <p class="section-sub">A visual log &mdash; shot, developed, and filed by Aarav.</p>
  </div>
  ${admin?`<div class="admin-bar"><span class="adot"></span>ADMIN MODE &mdash; upload photos below</div>
  <div class="add-box" onclick="addPhoto()">+ Upload a photo</div>`:''}
  <div class="masonry">${tiles}</div>`;
}
async function addPhoto(){
  const v = await openFormModal({
    title:'Upload a photo',
    desc:'Pick an image from your device. It will be compressed to fit within the Firestore free tier.',
    fields:[{name:'file', label:'Choose an image', type:'file', maxDim:1400, quality:0.75}, {name:'caption', label:'Caption (optional)'}],
    submitLabel:'Upload'
  });
  if(!v) return;
  if(!v.file){ showToast('Choose an image to upload.'); return; }
  if(v.file.length > 950000){ showToast('That photo is still too large after compression — try a simpler/smaller image.'); return; }
  const id = uid();
  const saved = await sset('photo:'+id, v.file);
  if(!saved){ showToast('Upload failed — check your Firestore rules.'); return; }
  const list = (await sget('photography:images')) || [];
  list.unshift({id, caption:v.caption});
  await sset('photography:images', list);
  showToast('Photo uploaded.');
  render();
}
async function deletePhoto(id){
  const ok = await openConfirmModal('This photo will be removed from the gallery.', true);
  if(!ok) return;
  let list = (await sget('photography:images')) || [];
  list = list.filter(x=>x.id!==id);
  await sset('photography:images', list);
  try{ await window.fbDeleteDoc(window.fbDoc(window.fbDb, 'portfolio', 'photo:'+id)); }catch(e){}
  render();
}

function munRollCallCode(value){
  const v=String(value||'').trim();
  if(v==='Present & Voting' || v==='Present and Voting' || v==='PV') return 'PV';
  if(v==='Absent' || v==='A') return 'A';
  return 'P';
}
function munRollCallLabel(value){
  const v=munRollCallCode(value);
  return v==='PV'?'Present & Voting':v==='A'?'Absent':'Present';
}
function munScoreTotal(d, cols){
  return cols.reduce((sum,c)=>{ const n=Number(d.values&&d.values[c]); return sum+(Number.isFinite(n)?n:0); },0);
}
function updateMunTotalsInDom(){
  const table=document.querySelector('table.marks');
  if(!table)return;
  const headers=Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
  const totalIndex=headers.findIndex(h=>h==='TOTAL');
  if(totalIndex<0)return;
  const rows=table.querySelectorAll('tbody tr');
  rows.forEach(row=>{
    const inputs=row.querySelectorAll('input[type=number]');
    if(!inputs.length)return;
    const total=Array.from(inputs).reduce((sum,input)=>{const n=Number(input.value);return sum+(Number.isFinite(n)?n:0)},0);
    const cell=row.children[totalIndex];
    if(cell)cell.textContent=total;
  });
}
function refreshMunWinnerHighlightDom(){
  const table=document.querySelector('table.marks');
  if(!table)return;
  const totalIndex=Array.from(table.querySelectorAll('thead th')).findIndex(th=>th.textContent.trim()==='TOTAL');
  if(totalIndex<0)return;
  const rows=Array.from(table.querySelectorAll('tbody tr'));
  const totals=rows.map(row=>Number(row.children[totalIndex]?.textContent)||0);
  const max=Math.max(...totals,0);
  rows.forEach((row,i)=>{
    const mode=row.querySelector('select[aria-label="Highlight mode"]')?.value;
    if(mode==='manual')return;
    row.classList.toggle('mun-winner',max>0 && totals[i]===max);
    row.classList.remove('mun-manual-highlight');
  });
}
function munWinnerIndexes(data){
  const delegates=data.delegates||[], cols=data.columns||[];
  if(!delegates.length || !cols.length) return new Set();
  const totals=delegates.map(d=>munScoreTotal(d,cols));
  const max=Math.max(...totals);
  if(!Number.isFinite(max) || max<=0) return new Set();
  return new Set(totals.map((v,i)=>v===max?i:-1).filter(i=>i>=0));
}

    const hl=d.highlight||{mode:'auto',color:'#f4df9a'};
    const mode=hl.mode==='manual'?'manual':'auto', color=hl.color||'#f4df9a';
    return `<tr class="${munRowClass(d,i,winners)}"${munRowStyle(d)}><td><input value="${esc(d.delegation)}" oninput="setDel('${code}',${i},'delegation',this.value)"></td>${Array.from({length:data.days},(_,day)=>`<td>${munRollSelect(code,i,day,d.rollCalls?.[day])}</td>`).join('')}${cols.map(c=>`<td><input type="number" value="${esc((d.values&&d.values[c])??'')}" oninput="setDelVal('${code}',${i},'${c.replace(/'/g,"\\'")}',this.value);updateMunTotalsInDom();refreshMunWinnerHighlightDom()"></td>`).join('')}<td class="total-cell">${munScoreTotal(d,cols)}</td><td class="highlight-cell"><div class="highlight-tools"><select aria-label="Highlight mode" onchange="setDelHighlightMode('${code}',${i},this.value)"><option value="auto" ${mode==='auto'?'selected':''}>Auto</option><option value="manual" ${mode==='manual'?'selected':''}>Manual</option></select><input type="color" value="${esc(color)}" title="Choose row colour" onchange="setDelHighlightColor('${code}',${i},this.value)" ${mode==='auto'?'disabled':''}></div></td><td><button class="btn-sm outline" onclick="removeDel('${code}',${i})">&times;</button></td></tr>`;
  }).join('');
  return `<div class="index-box" style="margin-bottom:20px"><div class="index-head"><span class="label">MARKSHEET</span><span class="tag">${data.published?'LIVE':'DRAFT · AUTOSAVED'}</span></div><div class="marks-tools"><span>${esc(data.committee||'')}</span><span>${data.days} day${data.days===1?'':'s'} · ${data.delegates.length} delegations</span></div><div style="overflow-x:auto;margin-bottom:18px"><table class="marks"><thead><tr><th>Delegation</th>${Array.from({length:data.days},(_,i)=>`<th>Roll Call · Day ${i+1}</th>`).join('')}${cols.map(c=>`<th>${esc(c)} <span style="cursor:pointer" onclick="removeCol('${code}','${c.replace(/'/g,"\\'")}')">&times;</span></th>`).join('')}<th>TOTAL</th><th>HIGHLIGHT</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="${data.days+cols.length+4}" style="text-align:center;color:#8a8168">No delegations recorded.</td></tr>`}</tbody></table></div><div class="winner-note">AUTO = highest total is highlighted. Ties are highlighted together. Switch to MANUAL to colour a row yourself.</div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn-sm orange" onclick="openAddCountryToConf('${code}')">+ Add delegation</button><button class="btn-sm outline" onclick="addCol('${code}')">+ Add marks column</button><button class="btn-sm outline" onclick="arrangeMunMarksheet('${code}')">Arrange ↓ Marks</button><button class="btn-sm outline" onclick="downloadMunPDF('${code}')">Download PDF</button><button class="btn-sm outline" onclick="downloadMunExcel('${code}')">Download Excel</button>${data.published?`<button class="btn-sm outline" onclick="unpublishConf('${code}')">Unpublish</button><button class="btn-sm" onclick="publishConf('${code}')">Republish</button>`:`<button class="btn-sm" onclick="publishConf('${code}')">Publish marksheet</button>`}</div></div><div class="index-box"><div class="index-head"><span class="label">DELEGATE CHATBOX</span></div>${munChat(data,code,true)}</div>`;
}
async function openAddCountryToConf(code){const data=await sget('mun:conf:'+code);const selected=(data.delegates||[]).map(d=>d.delegation);const all=MUN_COUNTRIES.filter(c=>!selected.includes(c));const pick=await openCountryMatrix([]);if(!pick||!pick.length)return;const additions=pick.filter(c=>all.includes(c));data.delegates.push(...additions.map(c=>({delegation:c,rollCalls:Array(data.days).fill('P'),values:{}})));await sset('mun:conf:'+code,data);showToast(additions.length+' delegation(s) added.');render();}
async function setDel(code,i,field,val){await queueMunSave(code,data=>{data.delegates[i][field]=val;});}
async function setDelVal(code,i,col,val){await queueMunSave(code,data=>{data.delegates[i].values=data.delegates[i].values||{};data.delegates[i].values[col]=val;});}
async function arrangeMunMarksheet(code, silent=false){
  const pending=munSaveQueues.get(code);
  if(pending) await pending.catch(()=>{});
  const data=await sget('mun:conf:'+code);
  if(!data)return;
  const cols=data.columns||[];
  data.delegates=(data.delegates||[]).map((d,idx)=>({...d,__munOriginalIndex:idx})).sort((a,b)=>{
    const diff=munScoreTotal(b,cols)-munScoreTotal(a,cols);
    return diff || (a.__munOriginalIndex-b.__munOriginalIndex);
  }).map(({__munOriginalIndex,...d})=>d);
  await sset('mun:conf:'+code,data);
  if(!silent){showToast('Marksheet arranged by total, highest first.');render();}
  return data;
}
async function setRollCall(code,i,day,val){await queueMunSave(code,data=>{data.delegates[i].rollCalls=data.delegates[i].rollCalls||Array(data.days).fill('P');data.delegates[i].rollCalls[day]=munRollCallCode(val);});}
async function setDelHighlightMode(code,i,mode){await queueMunSave(code,data=>{data.delegates[i].highlight=data.delegates[i].highlight||{};data.delegates[i].highlight.mode=mode==='manual'?'manual':'auto';if(!data.delegates[i].highlight.color)data.delegates[i].highlight.color='#f4df9a';});render();}
async function setDelHighlightColor(code,i,color){await queueMunSave(code,data=>{data.delegates[i].highlight=data.delegates[i].highlight||{};data.delegates[i].highlight.mode='manual';data.delegates[i].highlight.color=color;});const row=document.querySelectorAll('table.marks tbody tr')[i];if(row){row.classList.remove('mun-winner');row.classList.add('mun-manual-highlight');row.style.setProperty('--mun-highlight',color);}}
async function addDel(code){const v=await openFormModal({title:'Add delegation',fields:[{name:'name',label:'Delegation name',placeholder:'e.g. France'}],submitLabel:'Add'});if(!v||!v.name)return;const data=await sget('mun:conf:'+code);data.delegates.push({delegation:v.name,rollCalls:Array(data.days).fill('P'),values:{}});await sset('mun:conf:'+code,data);render();}
async function removeDel(code,i){const ok=await openConfirmModal('Remove this delegation from the marksheet?',true);if(!ok)return;const data=await sget('mun:conf:'+code);data.delegates.splice(i,1);await sset('mun:conf:'+code,data);render();}
async function addCol(code){const v=await openFormModal({title:'Add marks column',fields:[{name:'name',label:'Column name',placeholder:'e.g. Working Paper'}],submitLabel:'Add'});if(!v||!v.name)return;const data=await sget('mun:conf:'+code);if(!data.columns.includes(v.name))data.columns.push(v.name);await sset('mun:conf:'+code,data);render();}
async function removeCol(code,col){const ok=await openConfirmModal(`Remove the column "${col}" from every delegation?`,true);if(!ok)return;const data=await sget('mun:conf:'+code);data.columns=data.columns.filter(c=>c!==col);await sset('mun:conf:'+code,data);render();}
async function publishConf(code){
  const saved=await sget('site:admin-passcode');
  const v=await openFormModal({title:'Publish marksheet',desc:'The current marksheet will be arranged highest-to-lowest by TOTAL and then published. Your draft remains saved.',fields:[{name:'p',label:'Admin passcode',type:'password'}],submitLabel:'Publish'});
  if(!v)return;
  if(v.p!==saved){showToast('Incorrect passcode. Not published.');return;}
  const data=await arrangeMunMarksheet(code,true);
  if(!data)return;
  data.published=true;data.draft=false;data.publishedAt=Date.now();
  await sset('mun:conf:'+code,data);
  showToast('Marksheet arranged and published.');render();
}
async function unpublishConf(code){
  const saved=await sget('site:admin-passcode');
  const v=await openFormModal({title:'Unpublish marksheet',desc:'This will remove the public results from the conference page. Your saved marksheet will remain intact and editable.',fields:[{name:'p',label:'Admin passcode',type:'password'}],submitLabel:'Unpublish'});
  if(!v)return;
  if(v.p!==saved){showToast('Incorrect passcode. Still published.');return;}
  const data=await sget('mun:conf:'+code);if(!data)return;
  data.published=false;data.draft=true;
  await sset('mun:conf:'+code,data);
  showToast('Marksheet unpublished. The draft is still saved.');render();
}
async function downloadMunExcel(code){
  const data=await sget('mun:conf:'+code); if(!data)return;
  if(!window.XLSX){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);}).catch(()=>null);}
  const headers=['Delegation',...Array.from({length:data.days},(_,i)=>`Roll Call · Day ${i+1}`),...(data.columns||[]),'TOTAL'];
  const body=(data.delegates||[]).map(d=>[d.delegation,...Array.from({length:data.days},(_,i)=>munRollCallCode(d.rollCalls?.[i])),...(data.columns||[]).map(c=>d.values?.[c]??''),munScoreTotal(d,data.columns||[])]);
  if(window.XLSX){const ws=XLSX.utils.aoa_to_sheet([['MUN MARKSHEET'],[data.name],['Committee',data.committee],['Conference days',data.days],[],headers,...body]);ws['!cols']=headers.map(h=>({wch:Math.max(14,String(h).length+2)}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Marksheet');XLSX.writeFile(wb,`${data.name.replace(/[^a-z0-9]+/gi,'_')}_Marksheet.xlsx`);showToast('Excel file downloaded.');}else{const csv=[headers,...body].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`${data.name}_Marksheet.csv`;a.click();showToast('Excel-compatible CSV downloaded.');}
}
async function downloadMunPDF(code){
  const pending=munSaveQueues.get(code);
  if(pending) await pending.catch(()=>{});
  const data=await sget('mun:conf:'+code); if(!data)return;
  if(!window.jspdf){await new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js';sc.onload=resolve;sc.onerror=reject;document.head.appendChild(sc);}).catch(()=>null);}
  if(!window.jspdf?.jsPDF){showToast('PDF library could not load. Please try again.');return;}
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({orientation:'landscape',unit:'pt',format:'a4'});
  const margin=28, pageW=doc.internal.pageSize.getWidth(), pageH=doc.internal.pageSize.getHeight();
  doc.setFont('courier','bold');doc.setFontSize(16);doc.text(String(data.name||'MUN Marksheet'),margin,32);
  doc.setFontSize(9);doc.setFont('courier','normal');doc.text(`${data.committee||'Committee'}  ·  ${data.days} day${data.days===1?'':'s'}  ·  ${(data.delegates||[]).length} delegations`,margin,48);
  const cols=data.columns||[];
  const headers=['Delegation',...Array.from({length:data.days},(_,i)=>`RC D${i+1}`),...cols,'TOTAL'];
  const widths=[112,...Array(data.days).fill(42),...cols.map(()=>58),48];
  const usable=pageW-margin*2, scale=Math.min(1,usable/widths.reduce((a,b)=>a+b,0));
  const ws=widths.map(w=>w*scale);
  let y=68,rowH=22;
  const drawRow=(cells,bold=false)=>{
    let x=margin;doc.setFont('courier',bold?'bold':'normal');doc.setFontSize(7);
    cells.forEach((cell,i)=>{const w=ws[i]||50;doc.rect(x,y,w,rowH);doc.text(String(cell??'').slice(0,Math.max(6,Math.floor(w/5))),x+4,y+14);x+=w;});y+=rowH;
    if(y>pageH-35){doc.addPage();y=30;}
  };
  drawRow(headers,true);
  (data.delegates||[]).forEach(d=>drawRow([d.delegation,...Array.from({length:data.days},(_,i)=>munRollCallCode(d.rollCalls?.[i])),...cols.map(c=>d.values?.[c]??''),munScoreTotal(d,cols)]));
  doc.save(`${String(data.name||'MUN').replace(/[^a-z0-9]+/gi,'_')}_Marksheet.pdf`);
  showToast('PDF downloaded.');
}
function munTableReadonly(data){const cols=data.columns||[];const rows=(data.delegates||[]).map(d=>`<tr><td>${esc(d.delegation)}</td>${Array.from({length:data.days},(_,i)=>{const r=munRollCallCode(d.rollCalls?.[i]);return `<td class="${r==='P'?'rc-present':r==='A'?'rc-absent':'rc-pv'}">${esc(r)}</td>`}).join('')}${cols.map(c=>`<td>${esc((d.values&&d.values[c])??'')}</td>`).join('')}<td class="total-cell">${munScoreTotal(d,cols)}</td></tr>`).join('');return `<div class="index-head"><span class="label">RESULTS</span><span class="tag">${esc(data.committee||'')}</span></div><div style="overflow-x:auto"><table class="marks"><thead><tr><th>Delegation</th>${Array.from({length:data.days},(_,i)=>`<th>Roll Call · Day ${i+1}</th>`).join('')}${cols.map(c=>`<th>${esc(c)}</th>`).join('')}<th>TOTAL</th></tr></thead><tbody>${rows||`<tr><td colspan="${data.days+cols.length+2}" style="text-align:center;color:#8a8168">No delegations recorded.</td></tr>`}</tbody></table></div>`}

function munChat(data, code, isAdmin){
  const msgs = (data.chat||[]).map(m=>`<div class="msg"><div class="ts">${new Date(m.ts).toLocaleString()}</div>${esc(m.text)}</div>`).join('');
  return `
  <div class="chatbox">${msgs || '<div class="empty" style="padding:0;">No messages from the dais yet.</div>'}</div>
  ${isAdmin?`<div class="chat-input-row">
    <input id="chatIn-${code}" placeholder="Message all delegates..." onkeydown="if(event.key==='Enter') sendChat('${code}')">
    <button class="btn-sm orange" onclick="sendChat('${code}')">Send</button>
  </div>`:''}`;
}
async function sendChat(code){
  const el = document.getElementById('chatIn-'+code);
  const text = el.value.trim(); if(!text) return;
  const data = await sget('mun:conf:'+code);
  data.chat = data.chat || [];
  data.chat.push({id:uid(), text, ts:Date.now()});
  await sset('mun:conf:'+code, data);
  el.value='';
  render();
}
