<style>
  :root{
    --cream:#f2ecdd;
    --cream-2:#ece4d0;
    --ink:#211c14;
    --orange:#e2652b;
    --orange-dark:#c1501e;
    --sage:#b7c495;
    --sage-dark:#8fa06a;

    --muted:#5c5546;
    --body-font:'Space Grotesk', Arial, Helvetica, sans-serif;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    background-image:radial-gradient(var(--ink) .6px, transparent .6px);

    background-attachment:fixed;
    color:var(--ink);
    font-family:var(--body-font);
    min-height:100vh;

    html{scroll-behavior:auto;}
    *{transition-duration:.001ms !important; animation-duration:.001ms !important;}

  h1,h2,h3,.pixel{
    font-family:'Press Start 2P', monospace;
    line-height:1.5;
    letter-spacing:0.5px;

  a{color:inherit;}

  .brand{display:flex; align-items:center; gap:12px; cursor:pointer;}
  .brand .dot{width:12px; height:12px; background:var(--orange); transform:rotate(45deg);}
  .brand span{font-family:'Press Start 2P', monospace; font-size:14px;}
  nav.links{display:flex; gap:28px; align-items:center; flex-wrap:wrap;}
  nav.links a{font-size:14px; font-weight:bold; text-decoration:none; padding:4px 2px; border-bottom:2px solid transparent; cursor:pointer; transition:border-color .2s ease, opacity .2s ease;}
  nav.links a:hover{opacity:.65;}
  nav.links a:hover, nav.links a.active{border-bottom:2px solid var(--orange);}
  nav.links.open{animation:dropIn .22s ease;}
  .mobile-toggle{display:none; font-size:22px; background:none; border:none; transition:transform .2s ease;}
  .mobile-toggle:active{transform:scale(.9);}

  #app{min-height:70vh; padding:120px 0 90px;}
  @media(max-width:900px){ #app{padding:96px 0 70px;} }
  #app{transition:opacity .32s ease, transform .32s ease; opacity:1; transform:translateY(0);}
  #app.page-out{opacity:0; transform:translateY(10px);}
  @keyframes dropIn{ from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);} }
  @keyframes fadeUp{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }

  /* HERO */
  .hero{display:grid; grid-template-columns:1.35fr 1fr; gap:56px; align-items:stretch;}
  .eyebrow{font-size:12px; letter-spacing:1px; color:var(--muted); margin-bottom:18px; font-family:var(--body-font);}
  .eyebrow .blink{display:inline-block; width:7px; height:7px; background:var(--orange); border-radius:50%; margin-right:6px;}
  h1.display{font-size:58px; margin:0 0 28px; line-height:1.35;}
  h1.display .accent{color:var(--orange);}
  .lede{font-size:18px; line-height:1.7; color:#3a3426; max-width:60ch; margin-bottom:34px;}
  .cta-row{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
  .btn-solid{background:var(--orange); color:var(--cream); border:2px solid var(--ink); padding:14px 20px; font-weight:bold; text-decoration:none; box-shadow:4px 4px 0 var(--ink); display:inline-flex; gap:8px; align-items:center; transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease; cursor:pointer;}
  .btn-solid:hover{transform:translate(2px,2px); box-shadow:2px 2px 0 var(--ink);}
  .btn-solid:active{transform:translate(4px,4px); box-shadow:0 0 0 var(--ink);}
  .btn-line{text-decoration:none; font-weight:bold; border-bottom:2px solid var(--orange); padding-bottom:2px; transition:opacity .15s ease; cursor:pointer;}
  .btn-line:hover{opacity:.65;}

  .console{background:var(--sage); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); padding:26px 26px 30px; display:flex; flex-direction:column; justify-content:space-between; position:relative; animation:fadeUp .5s ease .05s both;}
  .hero > div:first-child{animation:fadeUp .5s ease both;}
  .console-top{display:flex; justify-content:space-between; font-size:11px; font-family:'Press Start 2P', monospace;}
  .console-top .live{display:flex; align-items:center; gap:6px;}
  .console-top .live::before{content:''; width:7px; height:7px; background:var(--ink); border-radius:50%; display:inline-block;}
  .console-art{flex:1; display:flex; align-items:center; justify-content:center; padding:34px 0;}
  .console-art svg{width:96px; height:96px;}
  .console-tags{font-family:'Press Start 2P', monospace; font-size:14px; line-height:2.2;}

  .section-title{font-size:26px; margin:0 0 10px;}
  .section-sub{color:var(--muted); font-size:15px; margin-bottom:36px; max-width:64ch;}
  .page-head{margin-bottom:44px; animation:fadeUp .45s ease both;}

  .btn-sm{background:var(--ink); color:var(--cream); border:none; padding:8px 14px; font-size:13px; font-weight:bold; transition:opacity .15s ease, transform .15s ease;}
  .btn-sm.orange{background:var(--orange);}
  .btn-sm.outline{background:transparent; color:var(--ink); border:2px solid var(--ink);}

  .admin-bar .adot{width:8px;height:8px;background:var(--orange);border-radius:50%;}

  /* BOXED INDEX + PANEL LAYOUT (used by Flaperon + MUN) */
  .index-grid{display:grid; grid-template-columns:1.55fr 1fr; gap:24px; align-items:start;}
  .index-box{border:2px solid var(--ink); background:var(--cream-2); box-shadow:6px 6px 0 var(--ink); padding:26px; animation:fadeUp .45s ease .05s both;}
  .index-head{display:flex; justify-content:space-between; align-items:baseline; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:20px;}
  .index-head .label{font-family:'Press Start 2P', monospace; font-size:11px;}
  .index-head .tag{font-family:'Press Start 2P', monospace; font-size:10px; color:var(--muted);}

  .panel-box{border:2px solid var(--ink); background:var(--sage); box-shadow:6px 6px 0 var(--ink); padding:26px; position:sticky; top:100px; animation:fadeUp .45s ease .1s both;}

  footer h2.footer-heading{font-size:34px; color:var(--cream); margin:0; line-height:1.4;}

  footer .footer-meta{text-align:right; font-size:12px; color:#cbbfa4; line-height:2;}
  footer .footer-bottom{border-top:1px solid #3a3426; padding:20px 0 0; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px; font-size:12px; color:#8a8168;}
  footer .footer-nav-links{display:flex; gap:18px; flex-wrap:wrap;}
  footer .footer-nav-links a{cursor:pointer; color:#cbbfa4; text-decoration:none; transition:color .15s ease;}

  .back-link{display:inline-block; margin-bottom:24px; font-size:13px; font-weight:bold; text-decoration:none; border-bottom:2px solid var(--orange);}

  /* MODALS (replace prompt/confirm/alert, which the sandboxed preview blocks) */
  .modal-overlay{position:fixed; inset:0; background:rgba(33,28,20,0); z-index:400; display:flex; align-items:center; justify-content:center; padding:20px; transition:background .22s ease;}
  .modal-overlay.show{background:rgba(33,28,20,.6);}
  .modal-box{background:var(--cream); border:3px solid var(--ink); box-shadow:8px 8px 0 var(--ink); max-width:460px; width:100%; padding:28px; max-height:85vh; overflow-y:auto; opacity:0; transform:translateY(16px) scale(.98); transition:opacity .22s ease, transform .22s ease;}
  .modal-overlay.show .modal-box{opacity:1; transform:translateY(0) scale(1);}
  .modal-box h3{font-size:15px; margin:0 0 6px; font-family:var(--body-font); font-weight:bold;}
  .modal-box .mdesc{font-size:13px; color:var(--muted); margin:0 0 18px; line-height:1.5;}
  .modal-field{margin-bottom:15px;}
  .modal-field label{display:block; font-size:12px; color:var(--muted); margin-bottom:6px; font-weight:bold;}
  .modal-field input, .modal-field textarea, .modal-field select{width:100%; padding:10px; border:2px solid var(--ink); font-size:14px; font-family:var(--body-font); background:var(--cream-2);}
  .modal-field textarea{min-height:90px; resize:vertical;}
  .modal-field.dashed input{border-style:dashed;}
  .modal-field input[type=file]{border:2px dashed var(--ink); background:var(--cream); padding:16px 10px; cursor:pointer; font-size:12.5px;}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; margin-top:20px;}
  .modal-cancel{background:transparent; border:2px solid var(--ink); padding:10px 16px; font-weight:bold; font-size:13px;}
  .modal-submit{background:var(--orange); color:var(--cream); border:2px solid var(--ink); padding:10px 16px; font-weight:bold; font-size:13px; box-shadow:3px 3px 0 var(--ink);}

  .toast{position:fixed; bottom:24px; right:24px; background:var(--ink); color:var(--cream); padding:14px 20px; font-size:13px; border:2px solid var(--orange); z-index:500; opacity:0; transform:translateY(14px) scale(.97); transition:opacity .28s cubic-bezier(.2,.9,.3,1.2), transform .28s cubic-bezier(.2,.9,.3,1.2); max-width:320px;}
  .toast.show{opacity:1; transform:translateY(0) scale(1);}
  .file-picked{font-size:12px; color:var(--muted); margin-top:-8px; margin-bottom:14px;}

  @media(max-width:900px){

    nav.links{display:none;}

    h1.display{font-size:36px;}

  @media(max-width:900px){
    nav.links.open{display:flex; flex-direction:column; position:absolute; top:74px; left:0; right:0; background:var(--cream); border-bottom:3px solid var(--ink); padding:20px 32px; gap:16px;}
  }
</style>

<script>
/* ---------------- STATE & STORAGE HELPERS ---------------- */
const state = { page:'home', munCode:null, isAdmin:false };

async function sget(key){
  try{ const r = await window.storage.get(key, true); return r ? JSON.parse(r.value) : null; }
  catch(e){ return null; }
}
async function sset(key, value){
  try{ await window.storage.set(key, JSON.stringify(value), true); return true; }
  catch(e){ console.error(e); return false; }
}

function go(page, extra){
  state.page = page;
  if(extra) Object.assign(state, extra);
  document.getElementById('navLinks').classList.remove('open');
  document.querySelectorAll('nav.links a').forEach(a=>a.classList.toggle('active', a.dataset.p===page));
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function uid(){ return Math.random().toString(36).slice(2,9); }
function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let c=''; for(let i=0;i<6;i++) c+=chars[Math.floor(Math.random()*chars.length)];
  return c;
}
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ---------------- MODAL SYSTEM (replaces prompt/confirm/alert) ---------------- */
function resizeImageToDataURL(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function openFormModal(opts){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    const fieldsHtml = opts.fields.map(f=>{
      if(f.type==='textarea'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><textarea id="mf-${f.name}" placeholder="${esc(f.placeholder||'')}">${esc(f.value||'')}</textarea></div>`;
      } else if(f.type==='select'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><select id="mf-${f.name}">${f.options.map(o=>`<option value="${esc(o)}" ${o===f.value?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
      } else if(f.type==='password'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><input type="password" id="mf-${f.name}" value="${esc(f.value||'')}"></div>`;
      } else if(f.type==='file'){
        return `<div class="modal-field"><label>${esc(f.label)}</label><input type="file" accept="image/*" id="mf-${f.name}" onchange="document.getElementById('fp-${f.name}').textContent = this.files[0] ? this.files[0].name : ''"><div class="file-picked" id="fp-${f.name}"></div></div>`;
      } else {
        return `<div class="modal-field ${f.dashed?'dashed':''}"><label>${esc(f.label)}</label><input type="text" id="mf-${f.name}" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}"></div>`;
      }
    }).join('');
    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>${esc(opts.title)}</h3>
        ${opts.desc?`<p class="mdesc">${esc(opts.desc)}</p>`:''}
        ${fieldsHtml}
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancelBtn" type="button">Cancel</button>
          <button class="modal-submit" id="modalSubmitBtn" type="button">${esc(opts.submitLabel||'Save')}</button>
        </div>
      </div>
    </div>`;
    const overlay = document.getElementById('modalOverlay');
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = (val)=>{
      overlay.classList.remove('show');
      setTimeout(()=>{ root.innerHTML=''; resolve(val); }, 200);
    };
    document.getElementById('modalCancelBtn').onclick = ()=>close(null);
    overlay.onclick = (e)=>{ if(e.target.id==='modalOverlay') close(null); };
    document.getElementById('modalSubmitBtn').onclick = async ()=>{
      const btn = document.getElementById('modalSubmitBtn');
      const originalLabel = btn.textContent;
      const values = {};
      let hasFileField = opts.fields.some(f=>f.type==='file');
      if(hasFileField){ btn.textContent = 'Processing...'; btn.disabled = true; }
      for(const f of opts.fields){
        const el = document.getElementById('mf-'+f.name);
        if(f.type==='file'){
          const file = el.files && el.files[0];
          if(file){
            try{ values[f.name] = await resizeImageToDataURL(file, 1600, 0.82); }
            catch(e){ values[f.name] = null; }
          } else { values[f.name] = null; }
        } else {
          values[f.name] = el.value.trim();
        }
      }
      if(hasFileField){ btn.textContent = originalLabel; btn.disabled = false; }
      close(values);
    };
  });
}
function openConfirmModal(message, danger){
  return new Promise(resolve=>{
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h3>Are you sure?</h3>
        <p class="mdesc">${esc(message)}</p>
        <div class="modal-actions">
          <button class="modal-cancel" id="modalCancelBtn" type="button">Cancel</button>
          <button class="modal-submit ${danger?'danger':''}" id="modalSubmitBtn" type="button">Confirm</button>
        </div>
      </div>
    </div>`;
    const overlay = document.getElementById('modalOverlay');
    requestAnimationFrame(()=>overlay.classList.add('show'));
    const close = (val)=>{
      overlay.classList.remove('show');
      setTimeout(()=>{ root.innerHTML=''; resolve(val); }, 200);
    };
    document.getElementById('modalCancelBtn').onclick = ()=>close(false);
    overlay.onclick = (e)=>{ if(e.target.id==='modalOverlay') close(false); };
    document.getElementById('modalSubmitBtn').onclick = ()=>close(true);
  });
}
function showToast(msg){
  const t = document.createElement('div');
  t.className='toast';
  t.textContent = msg;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),300); }, 3200);
}

async function toggleAdmin(){

    document.getElementById('adminToggleLabel').textContent = 'Admin';
    render();

  }
  const saved = await sget('site:admin-passcode');
  if(!saved){
    const v = await openFormModal({
      title:'Set up your admin passcode',
      desc:"You'll use this to edit pages and publish MUN marksheets. Keep it safe — anyone with it can edit the site.",
      fields:[{name:'p', label:'Choose a passcode', type:'password'}],
      submitLabel:'Set passcode'
    });
    if(!v || !v.p) return;
    await sset('site:admin-passcode', v.p);
    state.isAdmin = true;
    showToast('Admin passcode set — you are now in admin mode.');
  } else {
    const v = await openFormModal({ title:'Enter admin passcode', fields:[{name:'p', label:'Passcode', type:'password'}], submitLabel:'Enter' });
    if(!v) return;
    if(v.p === saved){ state.isAdmin = true; showToast('Admin mode on.'); }
    else { showToast('Incorrect passcode.'); return; }
  }
  document.getElementById('adminToggleLabel').textContent = 'Admin: ON';
  render();

/* ---------------- RENDER ROUTER ---------------- */
let renderToken = 0;
async function render(){
  const app = document.getElementById('app');
  const myToken = ++renderToken;
  app.classList.add('page-out');
  let html = '';
  if(state.page==='home') html = pageHome();
  else if(state.page==='flaperon') html = await pageFlaperon();
  else if(state.page==='mun') html = await pageMunList();
  else if(state.page==='mun-detail') html = await pageMunDetail(state.munCode);
  else if(state.page==='photography') html = await pagePhotography();
  else if(state.page==='projects') html = await pageProjects();
  else if(state.page==='experience') html = await pageExperience();
  if(myToken !== renderToken) return; // a newer render started; drop this one
  app.innerHTML = html;
  void app.offsetWidth;
  app.classList.remove('page-out');
}

      <div class="eyebrow">MUN // ${code}</div>
      <h2 class="section-title">${esc(data.name)}</h2>
      <p class="section-sub">${data.published? 'Marksheet published — visible to everyone.' : 'Marksheet not yet published.'}</p>
    </div>`;

  if(admin){
    return backLink + header + `<div class="admin-bar"><span class="adot"></span>ADMIN MODE &mdash; edit the marksheet and message delegates below</div>` + munAdminPanel(code, data);
  } else {
    if(data.published){
      return backLink + header + `<div class="index-box">${munTableReadonly(data)}</div>`;
    } else {
      return backLink + header + `
        <div class="index-box">
          <div class="empty" style="margin-bottom:0;">This conference hasn't been published yet. Watch this space for updates from the dais.</div>
        </div>
        <div class="index-box" style="margin-top:20px;">
          <div class="index-head"><span class="label">DAIS MESSAGES</span></div>
          ${munChat(data, code, false)}
        </div>`;
    }
  }
}

function munAdminPanel(code, data){
  const cols = data.columns;
  const rows = data.delegates.map((d,i)=>`
    <tr>
      <td><input value="${esc(d.delegation)}" onchange="setDel('${code}',${i},'delegation',this.value)"></td>
      <td>
        <select onchange="setDel('${code}',${i},'rollCall',this.value)">
          <option value="Present" ${d.rollCall==='Present'?'selected':''}>Present</option>
          <option value="Present & Voting" ${d.rollCall==='Present & Voting'?'selected':''}>Present &amp; Voting</option>
          <option value="Absent" ${d.rollCall==='Absent'?'selected':''}>Absent</option>
        </select>
      </td>
      ${cols.map(c=>`<td><input value="${esc((d.values&&d.values[c])||'')}" onchange="setDelVal('${code}',${i},'${c.replace(/'/g,"\\'")}',this.value)"></td>`).join('')}
      <td><button class="btn-sm outline" onclick="removeDel('${code}',${i})">&times;</button></td>
    </tr>`).join('');

  return `
  <div class="index-box" style="margin-bottom:20px;">
    <div class="index-head"><span class="label">MARKSHEET</span><span class="tag">${data.published?'LIVE':'DRAFT'}</span></div>
    <div style="overflow-x:auto; margin-bottom:18px;">
    <table class="marks">
      <thead><tr>
        <th>Delegation</th><th>Roll Call</th>
        ${cols.map(c=>`<th>${esc(c)} <span style="cursor:pointer;" onclick="removeCol('${code}','${c.replace(/'/g,"\\'")}')">&times;</span></th>`).join('')}
        <th></th>
      </tr></thead>
      <tbody>${rows || `<tr><td colspan="${cols.length+3}" style="text-align:center; color:#8a8168;">No delegations added yet.</td></tr>`}</tbody>
    </table>
    </div>
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-sm orange" onclick="addDel('${code}')">+ Add delegation</button>
      <button class="btn-sm outline" onclick="addCol('${code}')">+ Add column</button>
      ${data.published?`<button class="btn-sm outline" disabled>Already published</button>`:`<button class="btn-sm" onclick="publishConf('${code}')">Publish marksheet</button>`}
    </div>
  </div>
  <div class="index-box">
    <div class="index-head"><span class="label">DELEGATE CHATBOX</span></div>
    ${munChat(data, code, true)}
  </div>`;
}

async function setDel(code, i, field, val){
  const data = await sget('mun:conf:'+code);
  data.delegates[i][field] = val;
  await sset('mun:conf:'+code, data);
}
async function setDelVal(code, i, col, val){
  const data = await sget('mun:conf:'+code);
  data.delegates[i].values = data.delegates[i].values || {};
  data.delegates[i].values[col] = val;
  await sset('mun:conf:'+code, data);
}
async function addDel(code){
  const v = await openFormModal({title:'Add delegation', fields:[{name:'name', label:'Delegation name', placeholder:'e.g. France, WHO'}], submitLabel:'Add'});
  if(!v || !v.name) return;
  const data = await sget('mun:conf:'+code);
  data.delegates.push({delegation:v.name, rollCall:'Present', values:{}});
  await sset('mun:conf:'+code, data);
  render();
}
async function removeDel(code, i){
  const ok = await openConfirmModal('Remove this delegation from the marksheet?', true);
  if(!ok) return;
  const data = await sget('mun:conf:'+code);
  data.delegates.splice(i,1);
  await sset('mun:conf:'+code, data);
  render();
}
async function addCol(code){
  const v = await openFormModal({title:'Add column', fields:[{name:'name', label:'Column name', placeholder:'e.g. Working Paper'}], submitLabel:'Add'});
  if(!v || !v.name) return;
  const data = await sget('mun:conf:'+code);
  if(!data.columns.includes(v.name)) data.columns.push(v.name);
  await sset('mun:conf:'+code, data);
  render();
}
async function removeCol(code, col){
  const ok = await openConfirmModal(`Remove the column "${col}" from every delegation?`, true);
  if(!ok) return;
  const data = await sget('mun:conf:'+code);
  data.columns = data.columns.filter(c=>c!==col);
  await sset('mun:conf:'+code, data);
  render();
}
async function publishConf(code){
  const saved = await sget('site:admin-passcode');
  const v = await openFormModal({
    title:'Publish marksheet',
    desc:'Once published, the marksheet becomes visible to everyone and the dais chat is replaced by the results table. Confirm with your admin passcode.',
    fields:[{name:'p', label:'Admin passcode', type:'password'}],
    submitLabel:'Publish'
  });
  if(!v) return;
  if(v.p !== saved){ showToast('Incorrect passcode. Not published.'); return; }
  const data = await sget('mun:conf:'+code);
  data.published = true;
  await sset('mun:conf:'+code, data);
  showToast('Marksheet published.');
  render();
}

function munTableReadonly(data){
  const cols = data.columns;
  const rows = (data.delegates||[]).map(d=>{
    const rcClass = d.rollCall==='Present'?'rc-present':(d.rollCall==='Absent'?'rc-absent':'rc-pv');
    return `<tr><td>${esc(d.delegation)}</td><td class="${rcClass}">${esc(d.rollCall)}</td>${cols.map(c=>`<td>${esc((d.values&&d.values[c])||'')}</td>`).join('')}</tr>`;
  }).join('');
  return `<div class="index-head"><span class="label">RESULTS</span></div>
  <div style="overflow-x:auto;">
  <table class="marks">
    <thead><tr><th>Delegation</th><th>Roll Call</th>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${rows || `<tr><td colspan="${cols.length+2}" style="text-align:center; color:#8a8168;">No delegations recorded.</td></tr>`}</tbody>
  </table></div>`;
}

function munChat(data, code, isAdmin){
  const msgs = (data.chat||[]).map(m=>`<div class="msg"><div class="ts">${new Date(m.ts).toLocaleString()}</div>${esc(m.text)}</div>`).join('');
  return `
  <div class="chatbox">${msgs || '<div class="empty" style="padding:0;">No messages from the dais yet.</div>'}</div>
  ${isAdmin?`<div class="chat-input-row">
    <input id="chatIn-${code}" placeholder="Message all delegates..." onkeydown="if(event.key==='Enter') sendChat('${code}')">
    <button class="btn-sm orange" onclick="sendChat('${code}')">Send</button>
  </div>`:''}`;
}
async function sendChat(code){
  const el = document.getElementById('chatIn-'+code);
  const text = el.value.trim(); if(!text) return;
  const data = await sget('mun:conf:'+code);
  data.chat = data.chat || [];
  data.chat.push({id:uid(), text, ts:Date.now()});
  await sset('mun:conf:'+code, data);
  el.value='';
  render();
}

/* ---------------- INIT ---------------- */
go('home');
</script>
</body>
</html>
